[pytest]
DJANGO_SETTINGS_MODULE = zumodra.settings_test
python_files = tests.py test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test discovery paths
testpaths =
    tests
    hr_core/tests
    services/tests
    messages_sys/tests
    notifications/tests
    dashboard/tests
    analytics/tests
    integrations/tests
    core/tests
    api/tests
    services_public/tests
    blog/tests
    careers/tests
    ai_matching/tests
    configurations/tests
    security/tests
    jobs/tests
    tenant_profiles/tests
    payments/tests
    escrow/tests
    stripe_connect/tests
    interviews/tests

# Markers for test categorization
markers =
    unit: marks tests as unit tests (fast, isolated)
    integration: marks tests as integration tests (multi-component)
    api: marks tests as API endpoint tests
    e2e: marks tests as end-to-end workflow tests
    workflow: marks tests as end-to-end workflow tests
    permissions: marks tests as permission and access control tests
    services: marks tests as service layer business logic tests
    security: marks tests as security-related tests
    performance: marks tests as performance/load tests
    scalability: marks tests as scalability tests (concurrent users, high load)
    slow: marks tests as slow (deselect with '-m "not slow"')
    notifications: marks tests as notification system tests
    websocket: marks tests as WebSocket consumer tests
    celery: marks tests as Celery task tests
    deprecated: marks tests that depend on removed multi-tenancy (to be updated)

# Async testing configuration
asyncio_mode = auto

# Default options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Coverage configuration
[coverage:run]
source =
    jobs
    hr_core
    careers
    services
    notifications
    messages_sys
    tenant_profiles
    payments
    api
    core
    analytics
    dashboard
    integrations
    security
    ai_matching
omit =
    */migrations/*
    */tests/*
    */__pycache__/*
    */admin.py

[coverage:report]
show_missing = True
skip_covered = True
fail_under = 60
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
